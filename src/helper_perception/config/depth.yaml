depth_obstacle_detector_node:
  ros__parameters:
    input_depth_topic: /camera/depth/image_rect_raw
    output_obstacle_topic: /perception/obstacle/depth
    roi_x_min_ratio: 0.35
    roi_x_max_ratio: 0.65
    roi_y_min_ratio: 0.35
    roi_y_max_ratio: 0.75
    obstacle_distance_threshold: 0.8
    min_valid_depth: 0.2
    max_valid_depth: 3.0
    depth_unit_scale: 0.001
    distance_percentile: 10.0
