depth_obstacle_detector_node:
  ros__parameters:
    input_depth_topic: /camera/camera/depth/image_rect_raw
    input_camera_info_topic: /camera/camera/depth/camera_info
    output_obstacle_topic: /perception/obstacle/depth
    debug_topic: /perception/obstacle/depth_debug
    roi_x_min_ratio: 0.35
    roi_x_max_ratio: 0.65
    roi_y_min_ratio: 0.35
    roi_y_max_ratio: 0.75
    obstacle_distance_threshold: 0.8
    min_valid_depth: 0.2
    max_valid_depth: 3.0
    depth_unit_scale: 0.001
    distance_percentile: 10.0
    camera_height_m: 0.1889
    camera_pitch_deg: 0.0
    # Ignore floor/noise below 2 cm, then debounce sufficiently large regions.
    floor_clear_height_m: 0.02
    min_obstacle_pixels: 20
    obstacle_confirm_frames: 3
    clear_confirm_frames: 2

depth_obstacle_cloud_node:
  ros__parameters:
    input_depth_topic: /camera/camera/depth/image_rect_raw
    input_camera_info_topic: /camera/camera/depth/camera_info
    output_points_topic: /perception/depth/obstacle_points
    output_clearing_points_topic: /perception/depth/clearing_points
    output_frame: base_link
    roi_x_min_ratio: 0.35
    roi_x_max_ratio: 0.65
    roi_y_min_ratio: 0.35
    roi_y_max_ratio: 0.75
    min_valid_depth: 0.2
    max_valid_depth: 2.0
    depth_unit_scale: 0.001
    # Objects below 0.05 m are handled as traversable "overcome" targets.
    min_obstacle_height_m: 0.05
    max_obstacle_height_m: 0.30
    camera_height_m: 0.1889
    camera_pitch_deg: 0.0
    camera_x_offset_m: 0.1847
    sample_step: 4
    max_points: 3000
