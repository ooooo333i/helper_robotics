depth_obstacle_detector_node:
  ros__parameters:
    input_depth_topic: /camera/camera/depth/image_rect_raw
    input_camera_info_topic: /camera/camera/depth/camera_info
    output_obstacle_topic: /perception/obstacle/depth
    debug_topic: /perception/obstacle/depth_debug
    roi_apex_x_ratio: 0.5
    roi_apex_y_ratio: 0.5
    obstacle_distance_threshold: 0.8
    min_valid_depth: 0.2
    max_valid_depth: 3.0
    depth_unit_scale: 0.001
    distance_percentile: 10.0
    camera_height_m: 0.272
    camera_pitch_deg: 36.0
    height_depth_window_m: 0.02
