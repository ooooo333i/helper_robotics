scan_filter_node:
  ros__parameters:
    input_scan_topic: /perception/scan/raw
    output_scan_topic: /perception/scan/filtered
    angle_min_deg: -90.0
    angle_max_deg: 90.0
    min_valid_range: 0.15
    max_valid_range: 8.0

lidar_obstacle_detector_node:
  ros__parameters:
    input_scan_topic: /perception/scan/filtered
    output_obstacle_topic: /perception/obstacle/range
    detection_angle_min_deg: -35.0
    detection_angle_max_deg: 35.0
    obstacle_distance_threshold: 0.6
