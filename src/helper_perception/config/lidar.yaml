scan_filter_node:
  ros__parameters:
    input_scan_topic: /perception/lidar/front/scan_raw
    output_scan_topic: /perception/lidar/front/scan
    angle_min_deg: -90.0
    angle_max_deg: 90.0
    min_valid_range: 0.15
    max_valid_range: 8.0

lidar_obstacle_detector_node:
  ros__parameters:
    input_scan_topic: /perception/lidar/front/scan
    output_obstacle_topic: /perception/obstacle/lidar
    detection_angle_min_deg: -35.0
    detection_angle_max_deg: 35.0
    obstacle_distance_threshold: 0.6
