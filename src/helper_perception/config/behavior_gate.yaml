perception_behavior_gate_node:
  ros__parameters:
    path_topic: /local_plan
    scan_topic: /perception/scan/filtered
    odom_topic: /control/odom
    behavior_cmd_topic: /planning/behavior_cmd
    dynamic_obstacle_topic: /perception/obstacle/dynamic
    dynamic_speed_topic: /perception/obstacle/dynamic_speed
    base_frame: base_link
    path_timeout_sec: 1.0
    scan_timeout_sec: 0.5
    path_lookahead_m: 1.0
    path_obstacle_width_m: 0.25
    obstacle_min_range_m: 0.05
    obstacle_max_range_m: 2.0
    tracking_frame: odom
    dynamic_speed_threshold_mps: 0.08
    dynamic_match_distance_m: 0.60
    cluster_max_gap_m: 0.15
    cluster_min_points: 3
    scan_sample_step: 1
    stop_latch_enabled: true
    stop_min_hold_sec: 0.8
    stop_clear_hold_sec: 1.0
    stopped_linear_threshold_mps: 0.03
    stopped_angular_threshold_radps: 0.08
    publish_rate_hz: 5.0
    publish_repeated_commands: false
