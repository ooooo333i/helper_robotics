perception_behavior_gate_node:
  ros__parameters:
    path_topic: /local_plan
    scan_topic: /perception/scan/filtered
    depth_topic: /perception/obstacle/depth
    odom_topic: /control/odom
    behavior_cmd_topic: /planning/behavior_cmd
    dynamic_obstacle_topic: /perception/obstacle/dynamic
    dynamic_speed_topic: /perception/obstacle/dynamic_speed
    base_frame: base_link
    path_timeout_sec: 1.0
    scan_timeout_sec: 0.5
    path_lookahead_m: 2.0
    path_obstacle_width_m: 0.50
    immediate_obstacle_range_m: 0.0
    immediate_obstacle_width_m: 0.30
    obstacle_min_range_m: 0.05
    obstacle_max_range_m: 3.0
    lidar_initial_stop_sec: 0.5
    depth_initial_stop_sec: 0.5
    require_stopped_before_obstacle_decision: true
    depth_timeout_sec: 0.5
    depth_obstacle_height_m: 0.02
    depth_overcome_height_m: 0.05
    overcome_clear_hold_sec: 3.0
    tracking_frame: odom
    dynamic_speed_threshold_mps: 0.5
    dynamic_match_distance_m: 0.60
    ttc_stop_sec: 1.2
    ttc_min_closing_speed_mps: 0.20
    ttc_robot_speed_compensation: true
    depth_ttc_stop_sec: 1.2
    depth_ttc_min_closing_speed_mps: 0.20
    depth_ttc_robot_speed_compensation: true
    dynamic_confirm_count: 2
    dynamic_clear_count: 2
    cluster_max_gap_m: 0.15
    cluster_min_points: 3
    scan_sample_step: 1
    stop_latch_enabled: true
    stop_min_hold_sec: 0.8
    stop_clear_hold_sec: 2.0
    stopped_linear_threshold_mps: 0.03
    stopped_angular_threshold_radps: 0.08
    publish_rate_hz: 10.0
    publish_repeated_commands: true
