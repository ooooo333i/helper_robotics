motor_driver_node:
  ros__parameters:
    cmd_vel_topic: /control/cmd_vel_smoothed
    odom_topic: /control/odom
    obstacle_topic: /perception/obstacle/fused

    serial_port: /dev/ttyUSB0
    baud_rate: 57600
    driver_id: 1

    wheel_radius: 0.065
    track_width: 0.400
    gear_ratio: 49.0
    max_rpm: 4000
    max_linear_vel: 1.0
    max_angular_vel: 1.5

    control_rate: 20.0
    odom_publish_rate: 20.0
    cmd_timeout: 0.5
    publish_tf: true

    invert_left_motor: false
    invert_right_motor: false

    dry_run: false
    safety_stop_enabled: true
    stop_on_unknown: true
    obstacle_timeout: 1.0
    dry_run_log_period: 1.0
